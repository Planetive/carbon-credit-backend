name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rethink-carbon-production
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    env:
      # CI-only dummy secret — never production credentials.
      JWT_SECRET: ci-only-dummy-jwt-secret-not-for-production
      # Explicitly avoid production DB connectivity in the check job.
      DATABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: pip check
        run: python -m pip check

      - name: compileall fastapi_app
        run: python -m compileall -q fastapi_app

      - name: Import fastapi_app.main:app (dummy JWT only)
        run: |
          python - <<'PY'
          import os

          assert os.environ.get("JWT_SECRET") == "ci-only-dummy-jwt-secret-not-for-production"
          assert not os.environ.get("DATABASE_URL"), "check job must not use a production DATABASE_URL"

          from fastapi_app.main import app

          assert app is not None
          print("import_ok", getattr(app, "title", type(app).__name__))
          PY

      - name: Run offline unit tests (explicit allow-list)
        run: |
          # Explicitly identified offline/unit tests only (mocks or pure math;
          # no TestClient DB routes, no live Postgres/Supabase).
          # Included:
          #   tests/test_financing_instance_identity.py
          #   tests/test_pcaf_golden.py
          #   tests/test_fuel_golden.py
          #   tests/test_property_pcaf.py
          #   tests/test_motor_sovereign_pcaf.py
          #   tests/test_pcaf_phase3a_formula_consistency.py
          #   tests/test_pcaf_phase3c_scope_breakdown.py
          #   tests/test_historical_reconciliation.py
          #   tests/test_stationary_combustion.py
          #   tests/test_refrigerant_leakage.py
          #   tests/test_mobile_combustion.py
          # Excluded (API/TestClient, DB-backed, or external services):
          #   *_api.py, *_records.py, scope2/scope3 suite, spa_parity, ipcc_batch3, etc.
          python -m pytest -q --tb=short \
            tests/test_financing_instance_identity.py \
            tests/test_pcaf_golden.py \
            tests/test_fuel_golden.py \
            tests/test_property_pcaf.py \
            tests/test_motor_sovereign_pcaf.py \
            tests/test_pcaf_phase3a_formula_consistency.py \
            tests/test_pcaf_phase3c_scope_breakdown.py \
            tests/test_historical_reconciliation.py \
            tests/test_stationary_combustion.py \
            tests/test_refrigerant_leakage.py \
            tests/test_mobile_combustion.py

  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
    steps:
      - name: Require deployment secrets
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy via forced SSH command (GITHUB_SHA only)
        run: |
          set -euo pipefail
          SSH_DIR="$(mktemp -d)"
          trap 'rm -rf "$SSH_DIR"' EXIT
          umask 077

          # Preserve key line breaks; strip Windows CR; never print key/known_hosts.
          printf '%s' "$EC2_SSH_KEY" | tr -d '\r' > "$SSH_DIR/id_ed25519"
          if [ -s "$SSH_DIR/id_ed25519" ] && [ "$(tail -c1 "$SSH_DIR/id_ed25519" | wc -l)" -eq 0 ]; then
            printf '\n' >> "$SSH_DIR/id_ed25519"
          fi
          chmod 600 "$SSH_DIR/id_ed25519"

          printf '%s' "$EC2_KNOWN_HOSTS" | tr -d '\r' > "$SSH_DIR/known_hosts"
          if [ -s "$SSH_DIR/known_hosts" ] && [ "$(tail -c1 "$SSH_DIR/known_hosts" | wc -l)" -eq 0 ]; then
            printf '\n' >> "$SSH_DIR/known_hosts"
          fi
          chmod 600 "$SSH_DIR/known_hosts"

          ssh \
            -i "$SSH_DIR/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "${EC2_USER}@${EC2_HOST}" \
            "${GITHUB_SHA}"

      - name: Verify production health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 https://api.rethinkcarbon.io/health)"
          printf '%s' "$body" | python -c '
          import json, sys
          payload = json.load(sys.stdin)
          status = payload.get("status")
          database_status = payload.get("database_status")
          if status != "ok" or database_status != "connected":
              raise SystemExit(
                  f"health check failed: status={status!r} database_status={database_status!r} body={payload!r}"
              )
          print("health_ok", payload)
          '
